# 로컬 개발과 검사가 쓰는 Postgres 하나.
#
# 판을 고정한다 — 판이 흔들리면 마이그레이션이 로컬과 CI 에서 다르게 돈다.
# CI 는 이 파일을 쓰지 않고 GitHub Actions 의 서비스 컨테이너를 쓰므로,
# 그쪽 판도 같이 맞춰야 한다(.github/workflows/verify.yml).
services:
  postgres:
    image: postgres:16.4
    environment:
      POSTGRES_USER: keel
      POSTGRES_PASSWORD: keel
      POSTGRES_DB: keel
    ports:
      # 호스트 쪽만 5433 으로 옮긴다 — 이 기기의 5432 는 keel 과 무관한 다른
      # 프로젝트의 shop-postgres 컨테이너가 이미 물고 있다. 컨테이너 안쪽
      # 포트는 그대로 5432 라 이미지·마이그레이션에는 영향이 없다.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U keel']
      interval: 2s
      timeout: 3s
      retries: 20
